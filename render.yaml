services:
  - type: web
    name: carecloud-voice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"